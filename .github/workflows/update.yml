name: Refresh Preview Cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      theme:
        description: "Rebuild showcase walls in a theme: dark / light / rose / ocean / aurora / sunset / mint / all (empty = dark+light)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: profile-cards-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Impact card
        uses: ./components/impact-card
        with:
          token: ${{ github.token }}
          users: Morningstar202604
          output: components/impact-card/preview/impact-card.svg

      - name: Impact card (light)
        uses: ./components/impact-card
        with:
          token: ${{ github.token }}
          users: Morningstar202604
          theme: light
          output: components/impact-card/preview/impact-card-light.svg

      - name: Stats card
        uses: ./components/stats-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          output: components/stats-card/preview/stats-card.svg

      - name: Stats card (light)
        uses: ./components/stats-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          theme: light
          output: components/stats-card/preview/stats-card-light.svg

      - name: Streak card
        uses: ./components/streak-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          output: components/streak-card/preview/streak-card.svg

      - name: Streak card (light)
        uses: ./components/streak-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          theme: light
          output: components/streak-card/preview/streak-card-light.svg

      - name: Typing card
        uses: ./components/typing-card
        with:
          output: components/typing-card/preview/typing-card.svg

      - name: Typing card (light)
        uses: ./components/typing-card
        with:
          theme: light
          output: components/typing-card/preview/typing-card-light.svg

      - name: Contribution grid card (3D)
        uses: ./components/contrib-grid-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          output: components/contrib-grid-card/preview/contrib-grid-card.svg

      - name: Contribution grid card (3D, light)
        uses: ./components/contrib-grid-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          theme: light
          output: components/contrib-grid-card/preview/contrib-grid-card-light.svg

      - name: Tech stack card
        uses: ./components/tech-stack-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          output: components/tech-stack-card/preview/tech-stack-card.svg

      - name: Tech stack card (light)
        uses: ./components/tech-stack-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          theme: light
          output: components/tech-stack-card/preview/tech-stack-card-light.svg

      - name: Banner card
        uses: ./components/banner-card
        with:
          user: Morningstar202604
          output: components/banner-card/preview/banner-card.svg

      - name: Banner card (light)
        uses: ./components/banner-card
        with:
          user: Morningstar202604
          theme: light
          output: components/banner-card/preview/banner-card-light.svg

      - name: Badge card
        uses: ./components/badge-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          output: components/badge-card/preview/badge-card.svg

      - name: Badge card (light)
        uses: ./components/badge-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          theme: light
          output: components/badge-card/preview/badge-card-light.svg

      - name: Year review card
        uses: ./components/year-review-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          output: components/year-review-card/preview/year-review-card.svg

      - name: Year review card (light)
        uses: ./components/year-review-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          theme: light
          output: components/year-review-card/preview/year-review-card-light.svg

      - name: Projects card
        uses: ./components/projects-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          output: components/projects-card/preview/projects-card.svg

      - name: Projects card (light)
        uses: ./components/projects-card
        with:
          token: ${{ github.token }}
          user: Morningstar202604
          theme: light
          output: components/projects-card/preview/projects-card-light.svg

      - name: Install SVG renderer & deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          python3 -m pip install --quiet pillow 2>/dev/null || sudo apt-get install -y -qq python3-pil

      - name: Generate & render theme previews (manual runs only)
        if: inputs.theme != ''
        env:
          THEME: ${{ inputs.theme }}
          GH_TOKEN: ${{ github.token }}
          SHOTS_DIR: /tmp/shots
        run: bash scripts/generate_previews.sh

      - name: Render committed previews (dark & light)
        run: bash scripts/shot.sh

      - name: Build showcase walls & hero
        env:
          SHOTS_DIR: /tmp/shots
          THEME: ${{ inputs.theme }}
        run: python3 scripts/build_showcase.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh preview cards [skip ci]"
          git pull --rebase --autostash origin main || git rebase --abort
          git push || { git fetch origin && git rebase --autostash origin/main && git push; }
