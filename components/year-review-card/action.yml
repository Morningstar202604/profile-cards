name: Year Review Card
description: >-
  A golden annual ring — 12 months orbit the ring, the year's contribution
  total glows in the center, and four star-medals summarise the year.
  Real data from the GitHub contribution calendar (last 365 days) + merged PRs
  + repo languages. Zero server: a GitHub Action renders the SVG for you.

inputs:
  user:
    description: GitHub username
    required: true
  output:
    description: Output SVG path
    required: false
    default: year-review-card.svg
  token:
    description: "GitHub token (defaults to the workflow's github.token)"
    required: false
    default: "${{ github.token }}"
  theme:
    description: "Theme: dark (midnight) | light (ivory) | rose (rose gold) | ocean (deep sea)"
    required: false
    default: dark

runs:
  using: composite
  steps:
    - name: Generate year-review card
      env:
        GH_TOKEN: ${{ inputs.token }}
        USER: ${{ inputs.user }}
        THEME: ${{ inputs.theme }}
        OUTPUT: ${{ inputs.output }}
      run: python3 "${{ github.action_path }}/generate_year_review_card.py"
      shell: bash
